# RUN: yaml2obj %s | obj2yaml | FileCheck %s

## Round-trips the legacy shader model 5.x ISGN/OSGN signature parts (see
## dxbc::LegacySignatureElement): the same per-element fields as the newer
## ISG1/OSG1/PSG1 parts (SignatureParts.yaml) minus Stream/MinPrecision,
## which the pre-DXIL on-disk layout does not carry.

--- !dxcontainer
Header:
  Hash:            [ 0x0, 0x0, 0x0, 0x0, 0x0, 0x0, 0x0, 0x0, 0x0, 0x0,
                     0x0, 0x0, 0x0, 0x0, 0x0, 0x0 ]
  Version:
    Major:           1
    Minor:           0
  PartCount:       2
Parts:
  - Name:            ISGN
    Size:            60
    LegacySignature:
      Parameters:
        - Name:            A
          Index:           0
          SystemValue:     Undefined
          CompType:        Float32
          Register:        0
          Mask:            15
          ExclusiveMask:   0
        - Name:            B
          Index:           0
          SystemValue:     Undefined
          CompType:        UInt32
          Register:        1
          Mask:            3
          ExclusiveMask:   0
  - Name:            OSGN
    Size:            42
    LegacySignature:
      Parameters:
        - Name:            SV_Target
          Index:           0
          SystemValue:     Target
          CompType:        Float32
          Register:        0
          Mask:            15
          ExclusiveMask:   0
...

